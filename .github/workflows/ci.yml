name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # A missing hg or svn is a failure in CI, not a skipped test.
  SYSPI_REQUIRE_VCS: "1"

jobs:
  gate:
    name: Go gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install mercurial and subversion (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mercurial subversion
      - name: Install mercurial and subversion (macOS)
        if: runner.os == 'macOS'
        run: brew install mercurial subversion
      - name: Versions
        if: runner.os != 'Windows'
        run: go version && git --version && hg --version | head -1 && svn --version --quiet
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Unit and end-to-end tests
        # The Windows runner has git but no hg or svn; their tests skip there.
        env:
          SYSPI_REQUIRE_VCS: ${{ runner.os == 'Windows' && '' || '1' }}
        run: go test -count=1 ./...
  install-scripts:
    name: Installers against a fake release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install GNU tar (macOS)
        if: runner.os == 'macOS'
        run: brew install gnu-tar
      - name: install.sh and install.ps1
        if: runner.os != 'Windows'
        run: scripts/install-test.sh
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/install-test.ps1
  changelog-fragments:
    name: Changelog fragments well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/changelog.py check
  changelog:
    name: Changelog fragment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require a fragment for code changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(cmd|internal|tests)/'; then
            git diff --name-only --diff-filter=A "$base" HEAD | grep -E '^changes/unreleased/.+\.(added|changed|fixed|removed|deprecated|security)\.md$' \
              || { echo "code changed but no changes/unreleased/<slug>.<section>.md fragment was added"; exit 1; }
          fi
