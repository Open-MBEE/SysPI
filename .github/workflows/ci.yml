name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # A missing hg or svn is a failure in CI, not a skipped test.
  SYSPI_REQUIRE_VCS: "1"

jobs:
  gate:
    name: Go gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mercurial and subversion (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mercurial subversion
      - name: Install mercurial and subversion (macOS)
        if: runner.os == 'macOS'
        run: brew install mercurial subversion
      - name: Install mercurial and subversion (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y --no-progress hg sliksvn
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Mercurial'
          Add-Content $env:GITHUB_PATH 'C:\Program Files\SlikSvn\bin'
      - name: Versions
        run: go version && git --version && hg --version | head -1 && svn --version --quiet
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Unit and end-to-end tests
        run: go test -count=1 ./...
  changelog:
    name: Changelog fragment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a fragment for code changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(cmd|internal|tests)/'; then
            git diff --name-only --diff-filter=A "$base" HEAD | grep -E '^changes/unreleased/.+\.(added|changed|fixed|removed|deprecated|security)\.md$' \
              || { echo "code changed but no changes/unreleased/<slug>.<section>.md fragment was added"; exit 1; }
          fi
